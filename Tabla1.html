<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla1</title>
    <style>
        table {
            width: 200px;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 5px;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Colors</th>
        </tr>
        <tr>
            <td>Yellow</td>
        </tr>
        <tr>
            <td>Green</td>
        </tr>
        <tr>
            <td>Blue</td>
        </tr>
        <tr>
            <td>Red</td>
        </tr>
    </table>

</body>

</html>
