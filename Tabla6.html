<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Table</title>
    <style>
        table {
            width: 20%;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th colspan="2">Cars</th>
            </tr>
            <tr>
                <th>Brand</th>
                <th>Reference</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="5">Mazda</td>
                <td>CX-3</td>
            </tr>
            <tr>
                <td>CX-5</td>
            </tr>
            <tr>
                <td>CX-60</td>
            </tr>
            <tr>
                <td>323</td>
            </tr>
            <tr>
                <td>2</td>
            </tr>

            <tr>
                <td rowspan="2">Renault</td>
                <td>Sandero</td>
            </tr>
            <tr>
                <td>Kwid</td>
            </tr>

            <tr>
                <td>Chevrolet</td>
                <td>Aveo</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
